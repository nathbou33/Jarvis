<!doctype html><html><body><canvas id="c" width="64" height="64"></canvas>
<script type="module">
import * as THREE from 'three';
import { GPU } from '/src/sim/gpgpu.js';
import { Tunnel } from '/src/sim/tunnel.js';
import { CARS } from '/src/geometry/cars.js';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c') });
const gpu = new GPU(renderer);
const tunnel = new Tunnel(gpu);
const carId = q.get('car') || 'road';
const car = CARS[carId].build({});
tunnel.setup({ car, mode: '3d', quality: q.get('q') || 'low', yaw: 0, speed: 130, tempC: 20, altitude: 0, rollingRoad: true, rotatingWheels: true, turbulence: 0, carParams: {} });
const g = tunnel.grid, b = tunnel.bounds;
let out = 0, total = 0;
const perCat = {};
const slices = [];
for (let k = 0; k < g.nz; k++) for (let j = 0; j < g.ny; j++) for (let i = 0; i < g.nx; i++) {
  const c = tunnel.cat[i + g.nx * (j + g.ny * k)];
  if (!c) continue;
  total++;
  perCat[c] = (perCat[c] || 0) + 1;
  const x = g.x0 + (i + 0.5) * g.dx, y = (j + 0.5) * g.dx, z = g.z0 + (k + 0.5) * g.dx;
  if (x < b.min.x - g.dx || x > b.max.x + g.dx || y > b.max.y + g.dx || z < b.min.z - g.dx || z > b.max.z + g.dx) out++;
}
// coupe centrale k = nz/2 en ASCII
const kc = Math.floor(g.nz / 2);
for (let j = g.ny - 1; j >= 0; j--) { let row = ''; for (let i = 0; i < g.nx; i++) { const c = tunnel.cat[i + g.nx * (j + g.ny * kc)]; row += c ? String(c) : '.'; } slices.push(row); }
// plan horizontal j = 3
const jh = Number(q.get('j') || 3);
const plan = [];
for (let k = g.nz - 1; k >= 0; k--) { let row = ''; for (let i = 0; i < g.nx; i++) { const c = tunnel.cat[i + g.nx * (jh + g.ny * k)]; row += c ? String(c) : '.'; } plan.push(row); }
window.result = { total, out, perCat, bounds: [b.min.toArray(), b.max.toArray()], slice: slices.join('\n'), plan: plan.join('\n') };
</script></body></html>
