<!doctype html><html><body style="margin:0;background:#111"><canvas id="c" width="1600" height="900" style="width:1600px;height:900px"></canvas>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CARS } from '/src/geometry/cars.js';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setSize(1600, 900, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x30343b);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
const dl = new THREE.DirectionalLight(0xffffff, 1.5); dl.position.set(3, 6, 4); scene.add(dl);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x55595f, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const id = q.get('car') || 'f1';
const car = CARS[id].build({});
scene.add(car.group);
const cam = new THREE.PerspectiveCamera(30, 16 / 9, 0.1, 100);
const view = q.get('view') || 'iso';
const L = car.dims.L, cx = L / 2;
const views = { iso: [cx - 5.5, 2.6, 6.5], side: [cx, 0.6, 12], front: [-9, 0.7, 0.001], top: [cx, 14, 0.001], rear: [L + 8, 2, 3], low: [cx - 3, 0.25, 5] };
cam.position.set(...views[view]);
cam.lookAt(cx, view === 'top' ? 0 : 0.45, 0);
renderer.render(scene, cam);
window.ready = true;
</script></body></html>
